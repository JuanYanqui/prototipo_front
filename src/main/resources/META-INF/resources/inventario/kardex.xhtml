<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <ui:define name="content">
        <h:form id="frmKardex">
            <div class="cabecera">
                <h:outputText value="#{CtrKardex.titulo}" styleClass="titulo"/>
                <h:panelGroup styleClass="acciones">
                    <p:button value="Volver a inventario" icon="pi pi-arrow-left" styleClass="ui-button-secondary"
                              outcome="/inventario/inventarioProductos"/>
                </h:panelGroup>
            </div>
            <p:separator/>

            <div class="formgrid">
                <div class="campo ancho-2">
                    <p:outputLabel for="producto" value="Producto"/>
                    <p:selectOneMenu id="producto" value="#{CtrKardex.productoId}">
                        <f:selectItems value="#{CtrKardex.productos}" var="pr" itemValue="#{pr.id}"
                                       itemLabel="#{pr.nombre} (stock #{pr.stock})"/>
                        <p:ajax listener="#{CtrKardex.consultar()}" update="@form"/>
                    </p:selectOneMenu>
                </div>
                <h:panelGroup layout="block" styleClass="campo" rendered="#{CtrKardex.producto ne null}">
                    <label>Stock actual / mínimo</label>
                    <span class="dato-kardex">#{CtrKardex.producto.stock} / #{CtrKardex.producto.stockMinimo}</span>
                </h:panelGroup>
            </div>

            <p:dataTable value="#{CtrKardex.movimientos}" var="m" emptyMessage="Este producto aún no tiene movimientos"
                         rows="15" paginator="true" paginatorPosition="bottom" styleClass="tabla">
                <p:column headerText="Fecha" style="width:150px">
                    <h:outputText value="#{m.fecha}"><f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm:ss"/></h:outputText>
                </p:column>
                <p:column headerText="Tipo" style="width:100px">
                    <span class="tipo-mov tipo-#{m.tipo}">#{m.tipo}</span>
                </p:column>
                <p:column headerText="Cantidad" styleClass="num" style="width:90px">#{m.salida ? '-' : (m.entrada ? '+' : '±')}#{m.cantidad}</p:column>
                <p:column headerText="Stock antes" styleClass="num" style="width:100px">#{m.stockAnterior}</p:column>
                <p:column headerText="Stock después" styleClass="num" style="width:110px">#{m.stockNuevo}</p:column>
                <p:column headerText="Motivo">#{m.motivo}</p:column>
                <p:column headerText="Responsable">#{m.responsable}</p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
