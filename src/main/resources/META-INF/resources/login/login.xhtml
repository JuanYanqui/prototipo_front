<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Comercial Nova · Login</title>
    <h:outputStylesheet name="css/estilos.css"/>
</h:head>
<h:body styleClass="login-body">
    <h:form id="frmLogin" styleClass="login-card">
        <div class="login-brand">
            <i class="pi pi-shopping-bag"/>
            <h1>Comercial Nova</h1>
            <p>Inicie sesión para continuar</p>
        </div>

        <div class="login-campo">
            <p:outputLabel for="usuario" value="Usuario"/>
            <p:inputText id="usuario" value="#{CtrLogin.username}" styleClass="login-input"/>
        </div>
        <div class="login-campo">
            <p:outputLabel for="clave" value="Contraseña"/>
            <p:password id="clave" value="#{CtrLogin.password}" feedback="false" styleClass="login-input" redisplay="true"/>
        </div>

        <p:commandButton value="Ingresar" icon="pi pi-sign-in" styleClass="ui-button-success login-boton"
                         action="#{CtrLogin.ingresar()}" update="@form"/>
    </h:form>

    <p:growl id="msgBox" showDetail="true" showSummary="true" globalOnly="true" life="6000">
        <p:autoUpdate/>
    </p:growl>
</h:body>
</html>
