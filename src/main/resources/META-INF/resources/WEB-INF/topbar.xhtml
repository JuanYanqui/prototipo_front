<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:p="http://primefaces.org/ui">
    <div class="topbar">
        <h:link outcome="/index" styleClass="logo">
            <i class="pi pi-shopping-bag"/> Comercial Nova
        </h:link>
        <span class="topbar-info">Prototipo · Ventas con control de stock y concurrencia</span>
        <h:panelGroup styleClass="topbar-user" rendered="#{SesionUsuario.autenticado}">
            <span>#{SesionUsuario.nombre} (#{SesionUsuario.rol})</span>
            <h:form styleClass="topbar-logout-form">
                <p:commandButton value="Salir" icon="pi pi-sign-out" styleClass="ui-button-secondary ui-button-flat"
                                 action="#{SesionUsuario.cerrar()}" ajax="false"/>
            </h:form>
        </h:panelGroup>
    </div>
</ui:composition>
