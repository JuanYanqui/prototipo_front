<!DOCTYPE html>
<!--
  PLANTILLA PRINCIPAL (igual idea que gosap: topbar + menu lateral + contenido)
  Cada pagina hace:  template="/WEB-INF/template.xhtml"  y rellena  <ui:define name="content">
-->
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <f:facet name="first">
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    </f:facet>
    <title>Comercial Nova</title>
    <h:outputStylesheet name="css/estilos.css"/>
    <ui:insert name="head"/>
</h:head>

<h:body>
    <div class="layout-wrapper">
        <ui:include src="./topbar.xhtml"/>
        <ui:include src="./menu.xhtml"/>

        <div class="layout-main">
            <div class="layout-content">
                <ui:insert name="content"/>
            </div>
        </div>
    </div>

    <!-- Indicador de "cargando" mientras se procesa una peticion ajax -->
    <p:ajaxStatus onstart="PF('dlgAjaxStatus').show()" oncomplete="PF('dlgAjaxStatus').hide()"
                  onerror="PF('dlgAjaxStatus').hide()"/>
    <p:dialog widgetVar="dlgAjaxStatus" modal="true" closable="false" showHeader="false"
              resizable="false" draggable="false">
        <i class="pi pi-spin pi-spinner" style="font-size:2rem"/>
    </p:dialog>

    <!-- Mensajes globales: los envian los controladores con msgInfo / msgError -->
    <p:growl id="msgBox" widgetVar="msgBox" showDetail="true" showSummary="true" globalOnly="true" life="6000">
        <p:autoUpdate/>
    </p:growl>
</h:body>
</html>
