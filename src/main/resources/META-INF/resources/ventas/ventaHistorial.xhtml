<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/template.xhtml">
    <!-- PANTALLA: HISTORIAL DE VENTAS  ·  Controlador: beans/ventas/CtrVentaHistorial.java -->
    <ui:define name="content">
        <h:form id="frmListado">
            <div class="cabecera">
                <h:outputText value="#{CtrVentaHistorial.titulo}" styleClass="titulo"/>
                <h:panelGroup styleClass="acciones">
                    <p:commandButton value="Filtrar" icon="pi pi-refresh"
                                     actionListener="#{CtrVentaHistorial.filtrar()}" update="@form"/>
                </h:panelGroup>
            </div>
            <p:separator/>

            <p:dataTable value="#{CtrVentaHistorial.ventas}" var="v" emptyMessage="Aún no hay ventas"
                         rows="10" paginator="true" paginatorPosition="bottom" styleClass="tabla">
                <p:column headerText="#" style="width:60px">#{v.id}</p:column>
                <p:column headerText="Fecha">
                    <h:outputText value="#{v.fecha}"><f:convertDateTime type="localDateTime" pattern="dd/MM/yyyy HH:mm:ss"/></h:outputText>
                </p:column>
                <p:column headerText="Cliente">#{v.cliente}</p:column>
                <p:column headerText="Vendedor">#{v.vendedor}</p:column>
                <p:column headerText="Detalle">#{v.resumen}</p:column>
                <p:column headerText="Total" styleClass="num">
                    <h:outputText value="#{v.total}"><f:convertNumber pattern="$#,##0.00" locale="en_US"/></h:outputText>
                </p:column>
            </p:dataTable>
        </h:form>
    </ui:define>
</ui:composition>
