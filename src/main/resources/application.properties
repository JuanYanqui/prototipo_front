# ---------- Front JSF ----------
# El front corre en 8091; el back (API) en 8090.
server.port=8091

# Direccion de la API (prototipo_back). Se puede cambiar con la variable API_URL.
api.url=${API_URL:http://localhost:8090}

# JSF / PrimeFaces
joinfaces.faces.project-stage=Development
joinfaces.primefaces.theme=saga
joinfaces.faces.facelets-refresh-period=1
